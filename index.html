<!DOCTYPE html>

<html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#101010"> <title>Лисичка-сестричка</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: #101010;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .background-video {
        position: fixed;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
    }

    .background-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: rgba(0, 0, 0, 0.15);
    }

    .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 0 24px 40px;
        text-align: center;
    }

    .subtitle {
        max-width: 800px;
        margin: 0 0 24px;
        padding-top: 17vh;
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 3px;
        line-height: 1.8;
        text-transform: uppercase;
    }

    h1 {
        max-width: 1000px;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(38px, 8vw, 88px);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -2px;
        text-transform: uppercase;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
    }

    .downloads {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
        width: 100%;
        margin-top: 320px;
    }

    .download-button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 230px;
        min-height: 56px;
        padding: 16px 24px;
        border: 1px solid #ffffff;
        background: #ffffff;
        color: #111111;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-decoration: none;
        transition:
            background 0.25s ease,
            color 0.25s ease,
            transform 0.25s ease;
    }

    .download-button:hover {
        transform: translateY(-3px);
        background: transparent;
        color: #ffffff;
    }

@media (max-width: 560px) {
    .subtitle {
        max-width: 330px;
        font-size: 10px;
        letter-spacing: 2px;
    }

    h1 {
        font-size: clamp(34px, 10vw, 54px);
        letter-spacing: -2px;
    }

    .background-video {
        object-position: 48% 65%;
    }

    .downloads {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
        gap: 10px;
        margin-top: 230px;
    }

    .download-button {
        flex: 1;
        min-width: 0;
        max-width: 330px;
        min-height: 56px;
        padding: 14px 8px;
        font-size: 10px;
        letter-spacing: 0.5px;
    }
}

    @media (prefers-reduced-motion: reduce) {
        .download-button {
            transition: none;
        }
    }
</style>

</head>

<body> <video class="background-video" autoplay muted loop playsinline preload="auto"> <source src="ПОБЕДА.mp4" type="video/mp4"> </video>

<div class="background-overlay"></div>

<main class="page">
    <p class="subtitle">
        Фанатская модификация визуальной новеллы «Зайчик»
    </p>

    <h1>Лисичка-сестричка</h1>

    <div class="downloads">
        <a
            class="download-button"
            href="https://drive.google.com/file/d/11utvvCVy-EveANxRqg0TmImYi5lou-iv/view?usp=drive_link"
            target="_blank"
            rel="noopener noreferrer"
        >
            СКАЧАТЬ ДЛЯ WINDOWS
        </a>

        <a
            class="download-button"
            href="https://drive.google.com/file/d/17pQ45EfAcNYR23Im6gwCobaIkyF22BVT/view?usp=drive_link"
            target="_blank"
            rel="noopener noreferrer"
        >
            СКАЧАТЬ НА ANDROID
        </a>
    </div>

    </div>
</main>

</body> </html>
